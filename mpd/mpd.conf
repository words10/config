db_file "/home/words/.config/mpd/database"
sticker_file "/home/words/.config/mpd/sticker"
music_directory "/home/words/Music"
playlist_directory "/home/words/Playlists"

bind_to_address "localhost"
auto_update "yes"

decoder {
    plugin "wildmidi"
    enabled "no"
}

audio_output {
        type "pipewire"
        name "PipeWire Sound Server"
}

audio_output {
    type "fifo"
    name "my_fifo"
    path "/tmp/mpd.fifo"
    format "44100:16:2"
}
